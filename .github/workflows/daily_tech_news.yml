name: Daily Viral Agent (scripts by ~10 AM IST)
run-name: ${{ (github.event_name == 'schedule' || inputs.daily == 'true') && 'Daily run' || 'Manual test' }}

# MAIN TRIGGER: cron-job.org calls the "Run workflow" API at 08:15 IST with daily=true
# (GitHub's own schedule is often hours late or skipped, so it is only a backup).
# Every "Daily run" first checks whether a Daily run already succeeded today (IST) and
# exits in seconds if so, so there is never a double run.
on:
  schedule:
    - cron: "17 5 * * *"   # 10:47 IST backup
    - cron: "17 8 * * *"   # 13:47 IST last backup
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes between 1st and 2nd check (0 = quick test)"
        required: false
        default: "75"
      daily:
        description: "true = counts as today's daily run (used by cron-job.org)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-viral-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Skip if today's run already succeeded
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.daily }}" != "true" ]; then
            echo "Manual test run"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Kolkata date +%-H)
          # GitHub crons can fire 10-15 h late (e.g. 2 AM IST). Only run between 08:00 and 17:59 IST.
          if [ "$HOUR" -lt 8 ] || [ "$HOUR" -ge 18 ]; then
            echo "Outside the 08:00-18:00 IST window (hour $HOUR), skipping late trigger"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Count only today's successful Daily runs that started inside the window
          DONE=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_tech_news.yml/runs?status=success&per_page=30"             --jq "[.workflow_runs[] | select(.display_title == \"Daily run\" and .id != ${{ github.run_id }}) | select((.created_at | fromdateiso8601 + 19800 | strftime(\"%Y-%m-%d\")) == \"$TODAY\") | select((.created_at | fromdateiso8601 + 19800 | strftime(\"%H\") | tonumber) >= 8 and (.created_at | fromdateiso8601 + 19800 | strftime(\"%H\") | tonumber) < 18)] | length")
          echo "Successful daily runs today (IST $TODAY): $DONE"
          if [ "$DONE" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repository
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run agent
        if: steps.guard.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          WAIT_MINUTES: ${{ github.event.inputs.wait_minutes || vars.WAIT_MINUTES || '75' }}
          # Optional tuning (Settings -> Secrets and variables -> Actions -> Variables)
          IG_MIN_LIKES: ${{ vars.IG_MIN_LIKES }}
          IG_MIN_GAIN: ${{ vars.IG_MIN_GAIN }}
          IG_FAST_LIKES_PER_HOUR: ${{ vars.IG_FAST_LIKES_PER_HOUR }}
          YT_MIN_VIEWS: ${{ vars.YT_MIN_VIEWS }}
          YT_MAX_SUBS: ${{ vars.YT_MAX_SUBS }}
          YT_MIN_OUTLIER: ${{ vars.YT_MIN_OUTLIER }}
          YT_MIN_RECENT_COMMENTS: ${{ vars.YT_MIN_RECENT_COMMENTS }}
          NEWS_MIN_SOURCES: ${{ vars.NEWS_MIN_SOURCES }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python agent.py
